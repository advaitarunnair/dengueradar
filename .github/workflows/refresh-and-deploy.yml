name: Refresh data

on:
  schedule:
    - cron: "0 22 * * *" # every day 06:00 SGT (clusters and weather change daily; snapshots stay one per epi week)
  workflow_dispatch:

# Vercel deploys the site and API on every push to main, including these data commits.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Build weekly scores
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python scripts/build_scores.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            WEEK=$(python -c "import json; print(json.load(open('web/public/data/meta.json'))['epi_week'].replace('-W', '-'))")
            git commit -m "Weekly data refresh $WEEK"
            git push
          fi

